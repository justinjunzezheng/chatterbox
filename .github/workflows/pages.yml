name: Publish Chatterbox

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Prepare links for GitHub Pages
        run: sed -i 's|="/|="./|g' dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Chatterbox
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
